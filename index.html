<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приложение за Оптика - Управление на Поръчки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            flex: 1;
            min-width: 150px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-camera {
            background: #ff6b6b;
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-camera:hover {
            background: #ee5a52;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            padding: 8px 12px;
            font-size: 0.9em;
        }

        .btn-delete:hover {
            background: #ee5a52;
        }

        .prescription-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            border: 2px dashed #667eea;
        }

        .prescription-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 5px;
            margin-top: 10px;
        }

        .camera-input {
            display: none;
        }

        .image-preview {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 5px;
            border: 2px solid #667eea;
        }

        .remove-image {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1.2em;
        }

        .orders-list {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .orders-list h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .order-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }

        .order-item:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateX(5px);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .order-name {
            font-weight: 600;
            font-size: 1.1em;
            color: #333;
        }

        .order-date {
            color: #999;
            font-size: 0.9em;
        }

        .order-details {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 10px;
        }

        .order-details p {
            margin: 5px 0;
        }

        .prescription-tag {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.85em;
            margin-top: 8px;
        }

        .no-prescription-tag {
            display: inline-block;
            background: #ffb74d;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.85em;
            margin-top: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close-modal {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal:hover,
        .close-modal:focus {
            color: #000;
        }

        .modal h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .modal img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 5px;
            margin-top: 15px;
        }

        .specs-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .specs-table th,
        .specs-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .specs-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .specs-table tr:nth-child(even) {
            background: #f9f9f9;
        }

        .specs-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }

        .add-spec-row {
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
        }

        .add-spec-row:hover {
            background: #5568d3;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .button-group {
                flex-direction: column;
            }

            .btn-primary, .btn-secondary, .btn-camera {
                min-width: 100%;
            }
        }

        .success-message {
            background: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            animation: slideIn 0.3s;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-group input {
            flex: 1;
            min-width: 200px;
        }

        .filter-group button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👁️ Приложение за Оптика</h1>
            <p>Управление на поръчки и рецепти</p>
        </header>

        <div class="main-content">
            <!-- Форма за нова поръчка -->
            <div class="card">
                <h2>📋 Нова Поръчка</h2>
                <form id="orderForm">
                    <!-- Клиентски данни -->
                    <h3 style="margin-top: 20px; margin-bottom: 15px; color: #667eea;">Данни на Клиента</h3>
                    
                    <div class="form-group">
                        <label for="clientName">Име на клиента *</label>
                        <input type="text" id="clientName" required placeholder="Иван Петров">
                    </div>

                    <div class="form-group">
                        <label for="clientPhone">Телефон *</label>
                        <input type="tel" id="clientPhone" required placeholder="0888 123456">
                    </div>

                    <div class="form-group">
                        <label for="clientEmail">Имейл</label>
                        <input type="email" id="clientEmail" placeholder="ivan@example.com">
                    </div>

                    <div class="form-group">
                        <label for="orderDate">Дата на поръчката *</label>
                        <input type="date" id="orderDate" required>
                    </div>

                    <!-- Данни на очилата -->
                    <h3 style="margin-top: 20px; margin-bottom: 15px; color: #667eea;">Рамка на Очилата</h3>

                    <div class="form-group">
                        <label for="frameModel">Модел на рамката</label>
                        <input type="text" id="frameModel" placeholder="напр. Ray-Ban 5383">
                    </div>

                    <div class="form-group">
                        <label for="frameColor">Цвят</label>
                        <input type="text" id="frameColor" placeholder="Черен, Кафяв и т.н.">
                    </div>

                    <div class="form-group">
                        <label for="framePrice">Цена на рамката</label>
                        <input type="text" id="framePrice" placeholder="220 лв.">
                    </div>

                    <!-- Данни на лещите -->
                    <h3 style="margin-top: 20px; margin-bottom: 15px; color: #667eea;">Лещи</h3>

                    <div id="specsContainer"></div>

                    <button type="button" class="add-spec-row" onclick="addSpecRow()">+ Добави ред</button>

                    <!-- Рецепта -->
                    <div class="prescription-section">
                        <h3 style="color: #667eea; margin-bottom: 15px;">📷 Рецепта на Клиента</h3>
                        <p style="color: #666; margin-bottom: 15px;">Снимай рецептата с камерата на телефона или избери файл:</p>
                        <button type="button" class="btn-camera" onclick="triggerCamera()">📸 Снимка от Камера</button>
                        <input type="file" id="cameraInput" class="camera-input" accept="image/*" capture="environment">
                        
                        <div id="prescriptionPreview"></div>
                    </div>

                    <!-- Забележки -->
                    <div class="form-group" style="margin-top: 20px;">
                        <label for="notes">Забележки</label>
                        <textarea id="notes" placeholder="Допълнителни забележки за поръчката..."></textarea>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-primary">✓ Създай Поръчка</button>
                        <button type="reset" class="btn-secondary">🔄 Изчисти Форма</button>
                    </div>
                </form>
            </div>

            <!-- Списък с поръчки -->
            <div class="card">
                <h2>📦 Поръчки</h2>
                
                <div class="filter-group">
                    <input type="text" id="searchInput" placeholder="Търси по име на клиента...">
                    <button onclick="filterOrders()" class="btn-primary">🔍 Търси</button>
                </div>

                <div id="ordersList" class="orders-list" style="background: none; box-shadow: none; padding: 0;">
                    <div class="empty-message">Няма създадени поръчки. Добави първа поръчка! 📝</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модален прозорец за рецепта -->
    <div id="prescriptionModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closePrescriptionModal()">&times;</span>
            <h2>Рецепта на Клиента</h2>
            <img id="prescriptionImage" src="" alt="Рецепта">
        </div>
    </div>

    <script>
        // Инициализиране на датата
        document.getElementById('orderDate').valueAsDate = new Date();

        // Масив за съхранение на поръчките
        let orders = JSON.parse(localStorage.getItem('orders')) || [];

        // Инициализиране на спецификационни редове
        function initializeSpecs() {
            const container = document.getElementById('specsContainer');
            container.innerHTML = '';
            
            const specs = [
                { label: 'Дясно Око (О.D.)', type: 'right' },
                { label: 'Ляво Око (О.S.)', type: 'left' }
            ];

            specs.forEach((spec, index) => {
                const specGroup = document.createElement('div');
                specGroup.innerHTML = `
                    <div style="background: #f0f0f0; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                        <h4 style="margin-bottom: 10px; color: #333;">${spec.label}</h4>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label>Сф.</label>
                                <input type="text" class="specs-input" placeholder="Сфера" data-spec="sph" data-type="${spec.type}">
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label>Цил.</label>
                                <input type="text" class="specs-input" placeholder="Цилиндър" data-spec="cyl" data-type="${spec.type}">
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label>Ос</label>
                                <input type="text" class="specs-input" placeholder="Ос" data-spec="ax" data-type="${spec.type}">
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label>Д.П.</label>
                                <input type="text" class="specs-input" placeholder="Д.П." data-spec="dp" data-type="${spec.type}">
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(specGroup);
            });
        }

        // Добави нов ред в спецификациите
        function addSpecRow() {
            // Това е опционално - за допълнителни лещи или прогресивни лещи
            alert('Функцията за добавяне на редове е за бъдещо разширение');
        }

        // Разреши или преди да снимаш от камера
        function triggerCamera() {
            document.getElementById('cameraInput').click();
        }

        // Обработка на снимка
        document.getElementById('cameraInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    displayPrescriptionPreview(event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        // Показване на превю на рецептата
        function displayPrescriptionPreview(imageData) {
            const preview = document.getElementById('prescriptionPreview');
            preview.innerHTML = `
                <div class="image-preview">
                    <img src="${imageData}" alt="Превю на рецепта">
                    <button type="button" class="remove-image" onclick="removePrescription()">×</button>
                </div>
            `;
            document.getElementById('cameraInput').dataset.imageData = imageData;
        }

        // Премахни рецептата
        function removePrescription() {
            document.getElementById('prescriptionPreview').innerHTML = '';
            document.getElementById('cameraInput').value = '';
            delete document.getElementById('cameraInput').dataset.imageData;
        }

        // Събери данни от спецификациите
        function getSpecsData() {
            const specs = {};
            const inputs = document.querySelectorAll('.specs-input');
            
            inputs.forEach(input => {
                const type = input.dataset.type;
                const spec = input.dataset.spec;
                
                if (!specs[type]) {
                    specs[type] = {};
                }
                specs[type][spec] = input.value;
            });

            return specs;
        }

        // Обработка на формата
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const order = {
                id: Date.now(),
                clientName: document.getElementById('clientName').value,
                clientPhone: document.getElementById('clientPhone').value,
                clientEmail: document.getElementById('clientEmail').value,
                orderDate: document.getElementById('orderDate').value,
                frameModel: document.getElementById('frameModel').value,
                frameColor: document.getElementById('frameColor').value,
                framePrice: document.getElementById('framePrice').value,
                specs: getSpecsData(),
                prescription: document.getElementById('cameraInput').dataset.imageData || null,
                notes: document.getElementById('notes').value
            };

            orders.unshift(order);
            localStorage.setItem('orders', JSON.stringify(orders));

            // Показване на съобщение за успех
            showSuccessMessage();

            // Изчистване на формата
            document.getElementById('orderForm').reset();
            removePrescription();
            document.getElementById('orderDate').valueAsDate = new Date();
            initializeSpecs();

            // Обновяване на списъка
            displayOrders();
        });

        // Показване на съобщение за успех
        function showSuccessMessage() {
            const ordersList = document.getElementById('ordersList').parentElement;
            const message = document.createElement('div');
            message.className = 'success-message';
            message.textContent = '✓ Поръчката е създадена успешно!';
            ordersList.insertBefore(message, ordersList.firstChild);
            
            setTimeout(() => {
                message.remove();
            }, 3000);
        }

        // Показване на поръчките
        function displayOrders() {
            const ordersList = document.getElementById('ordersList');
            
            if (orders.length === 0) {
                ordersList.innerHTML = '<div class="empty-message">Няма създадени поръчки. Добави първа поръчка! 📝</div>';
                return;
            }

            ordersList.innerHTML = '';

            orders.forEach(order => {
                const orderDate = new Date(order.orderDate).toLocaleDateString('bg-BG');
                const hasPrescription = order.prescription !== null;

                const orderElement = document.createElement('div');
                orderElement.className = 'order-item';
                orderElement.innerHTML = `
                    <div class="order-header">
                        <div>
                            <div class="order-name">👤 ${order.clientName}</div>
                            <div class="order-date">📅 ${orderDate}</div>
                        </div>
                        <button class="btn-delete" onclick="deleteOrder(${order.id})">🗑️ Изтрий</button>
                    </div>
                    <div class="order-details">
                        <p><strong>Телефон:</strong> ${order.clientPhone}</p>
                        ${order.clientEmail ? `<p><strong>Имейл:</strong> ${order.clientEmail}</p>` : ''}
                        <p><strong>Рамка:</strong> ${order.frameModel || 'Не е посочена'} (${order.frameColor || 'без цвят'})</p>
                        ${order.framePrice ? `<p><strong>Цена:</strong> ${order.framePrice}</p>` : ''}
                        <p><strong>Лещи:</strong></p>
                        <div style="margin-left: 15px; font-size: 0.9em;">
                            <p>Дясно Око (О.D.): ${order.specs.right ? formatSpecs(order.specs.right) : 'Няма данни'}</p>
                            <p>Ляво Око (О.S.): ${order.specs.left ? formatSpecs(order.specs.left) : 'Няма данни'}</p>
                        </div>
                        ${order.notes ? `<p><strong>Забележки:</strong> ${order.notes}</p>` : ''}
                    </div>
                    ${hasPrescription ? `
                        <span class="prescription-tag" onclick="showPrescription(${order.id})">
                            📸 Рецепта - Виж
                        </span>
                    ` : `
                        <span class="no-prescription-tag">
                            ⚠️ Без рецепта
                        </span>
                    `}
                `;

                ordersList.appendChild(orderElement);
            });
        }

        // Форматиране на спецификациите
        function formatSpecs(specs) {
            const parts = [];
            if (specs.sph) parts.push(`Сф: ${specs.sph}`);
            if (specs.cyl) parts.push(`Цил: ${specs.cyl}`);
            if (specs.ax) parts.push(`Ос: ${specs.ax}`);
            if (specs.dp) parts.push(`Д.П.: ${specs.dp}`);
            return parts.length > 0 ? parts.join(', ') : 'Няма данни';
        }

        // Показване на рецептата в модален прозорец
        function showPrescription(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order && order.prescription) {
                document.getElementById('prescriptionImage').src = order.prescription;
                document.getElementById('prescriptionModal').style.display = 'block';
            }
        }

        // Затваряне на модалния прозорец
        function closePrescriptionModal() {
            document.getElementById('prescriptionModal').style.display = 'none';
        }

        // Затвори модала ако кликнеш вън от него
        window.onclick = function(event) {
            const modal = document.getElementById('prescriptionModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Изтриване на поръчка
        function deleteOrder(orderId) {
            if (confirm('Сигурен ли си че искаш да изтриеш тази поръчка?')) {
                orders = orders.filter(order => order.id !== orderId);
                localStorage.setItem('orders', JSON.stringify(orders));
                displayOrders();
            }
        }

        // Филтриране на поръчките
        function filterOrders() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = orders.filter(order => 
                order.clientName.toLowerCase().includes(searchTerm)
            );

            const ordersList = document.getElementById('ordersList');
            ordersList.innerHTML = '';

            if (filtered.length === 0) {
                ordersList.innerHTML = '<div class="empty-message">Няма намерени поръчки 🔍</div>';
                return;
            }

            filtered.forEach(order => {
                const orderDate = new Date(order.orderDate).toLocaleDateString('bg-BG');
                const hasPrescription = order.prescription !== null;

                const orderElement = document.createElement('div');
                orderElement.className = 'order-item';
                orderElement.innerHTML = `
                    <div class="order-header">
                        <div>
                            <div class="order-name">👤 ${order.clientName}</div>
                            <div class="order-date">📅 ${orderDate}</div>
                        </div>
                        <button class="btn-delete" onclick="deleteOrder(${order.id})">🗑️ Изтрий</button>
                    </div>
                    <div class="order-details">
                        <p><strong>Телефон:</strong> ${order.clientPhone}</p>
                        ${order.clientEmail ? `<p><strong>Имейл:</strong> ${order.clientEmail}</p>` : ''}
                        <p><strong>Рамка:</strong> ${order.frameModel || 'Не е посочена'} (${order.frameColor || 'без цвят'})</p>
                        ${order.framePrice ? `<p><strong>Цена:</strong> ${order.framePrice}</p>` : ''}
                        <p><strong>Лещи:</strong></p>
                        <div style="margin-left: 15px; font-size: 0.9em;">
                            <p>Дясно Око (О.D.): ${order.specs.right ? formatSpecs(order.specs.right) : 'Няма данни'}</p>
                            <p>Ляво Око (О.S.): ${order.specs.left ? formatSpecs(order.specs.left) : 'Няма данни'}</p>
                        </div>
                        ${order.notes ? `<p><strong>Забележки:</strong> ${order.notes}</p>` : ''}
                    </div>
                    ${hasPrescription ? `
                        <span class="prescription-tag" onclick="showPrescription(${order.id})">
                            📸 Рецепта - Виж
                        </span>
                    ` : `
                        <span class="no-prescription-tag">
                            ⚠️ Без рецепта
                        </span>
                    `}
                `;

                ordersList.appendChild(orderElement);
            });
        }

        // Инициализиране на приложението
        window.addEventListener('load', function() {
            initializeSpecs();
            displayOrders();
        });

        // Разреширане на Enter в search полето
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                filterOrders();
            }
        });
    </script>
</body>
</html>
